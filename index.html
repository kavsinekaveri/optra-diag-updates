<style>
:root{--bg:#0b0b0d;--card:#17181c;--line:#2a2c32;--text:#f2f2f4;--mute:#a4a7b0;--red:#ff3b3b;--red2:#d62222}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:16px/1.7 "Tajawal","Rubik",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top,.bottom{text-align:center}
.logo{height:46px;width:auto;max-width:62%}
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.langs button{background:rgba(20,20,22,.72);border:1px solid rgba(255,255,255,.18);color:#d4d6dc;border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;backdrop-filter:blur(6px)}
.langs button.on{border-color:var(--red);color:#fff;background:rgba(255,59,59,.22)}
.hero{container-type:inline-size;position:relative;max-width:560px;margin:0 auto;aspect-ratio:704/1252;background:#000 url(img/hero.jpg) center/cover no-repeat;display:flex;flex-direction:column;justify-content:space-between;padding:16px 18px 28px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.7) 0,rgba(0,0,0,.35) 26%,transparent 40%),linear-gradient(to top,rgba(8,5,3,.96) 0,rgba(8,5,3,.72) 28%,transparent 56%)}
.hero>*{position:relative}
.bgblur{position:fixed;inset:0;z-index:-1;background:url(img/hero.jpg) center/cover;filter:blur(26px) brightness(.26);transform:scale(1.15)}
@media(min-width:600px){.hero{border-radius:0 0 34px 34px;width:min(560px,calc(100vh * .5623));min-width:420px}}
h1,h2,.dl,.card b{font-family:"Russo One","Lalezar",Impact,"Arial Black",sans-serif;font-weight:400}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] .dl,html[lang=ar] .card b{font-family:"Lalezar","Tajawal",sans-serif}
h1{font-size:clamp(22px,6.6vw,38px);font-size:clamp(22px,6.6cqw,40px);line-height:1.2;margin:18px 0 0;text-transform:uppercase;text-shadow:0 3px 18px rgba(0,0,0,.7)}
html[lang=ar] h1{text-transform:none;font-size:clamp(28px,8vw,42px);font-size:clamp(28px,8.4cqw,46px)}
html:not([lang=ar]) h1{font-style:italic}
h1::after{content:"";display:block;width:84px;height:6px;background:var(--red);margin:14px auto 0;transform:skewX(-22deg)}
.bottom p{color:#e8e4de;max-width:480px;margin:0 auto 18px;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.dl{display:inline-block;max-width:100%;background:var(--red);color:#fff;text-decoration:none;font-size:20px;letter-spacing:.5px;padding:16px 36px;border-radius:16px;box-shadow:0 10px 34px rgba(255,59,59,.45)}
.dl:active{background:var(--red2)}
.badge{display:block;width:max-content;max-width:100%;margin:14px auto 0;font-size:13px;color:#d4d6dc;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px 14px;background:rgba(0,0,0,.35)}
section{margin-top:40px}
.wrap>section:first-child{margin-top:34px}
h2{font-size:23px;margin-bottom:14px}
h2::before{content:"";display:inline-block;width:7px;height:.95em;background:var(--red);transform:skewX(-18deg);margin-inline-end:11px;vertical-align:-3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:rgba(23,24,28,.92);border:1px solid var(--line);border-inline-start:4px solid var(--red);border-radius:18px;padding:16px}
.card b{display:block;margin-bottom:2px;font-size:18px}
.card span{color:var(--mute);font-size:15px}
ol{padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
ol li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px 14px 16px;display:flex;gap:14px;align-items:flex-start}
ol li::before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;display:grid;place-items:center}
.note{background:#1d1517;border:1px solid #4a2326;border-radius:18px;padding:14px 16px;margin-top:12px;color:#ffd9d9;font-size:15px}
ul.plain{padding-inline-start:20px;color:var(--mute)}
ul.plain li{margin:6px 0}
ul.plain b{color:var(--text)}
.contact{display:flex;flex-wrap:wrap;gap:10px}
.contact a{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 18px;text-decoration:none;font-weight:600}
.contact img{width:26px;height:26px}
footer{margin:56px 0 30px;padding-top:22px;border-top:1px solid var(--line);color:var(--mute);font-size:13px;text-align:center}
footer img{height:54px;margin-bottom:10px}
footer p{margin:6px auto;max-width:620px}
</style>
</head>

var order=["ar","en","ru","uz"], WA="966578087254";
function pick(){

}
function apply(l){
  var d=T[l];
