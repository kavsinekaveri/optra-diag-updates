.hero .sub{max-width:640px;margin:16px auto 0;color:#e7e3dc;font-size:clamp(16px,2.4vw,20px);text-shadow:0 2px 14px rgba(0,0,0,.9)}

.hero .bot{margin-top:auto;padding-top:40px}

.hero .spacer{height:34vh;min-height:150px}
.scrollhint{position:absolute;bottom:18px;inset-inline:0;margin:auto;width:26px;height:44px;border:2px solid rgba(255,255,255,.4);border-radius:14px}
.scrollhint::after{content:"";position:absolute;top:8px;left:50%;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#fff;animation:sc 1.8s infinite}

.phone{position:relative;width:292px;height:594px;margin:0 auto;border-radius:46px;padding:11px;background:linear-gradient(160deg,#2d2e36,#0c0c10);box-shadow:0 40px 90px rgba(0,0,0,.7),0 0 0 2px #3a3b44,0 0 120px rgba(255,59,59,.22);}
